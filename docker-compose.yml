services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  financial-be:
    build: .
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      PORT: "3001"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
